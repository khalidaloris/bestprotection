:root{--bg:#f2f4f7;--card:#fff;--tx:#14171c;--mut:#5d636c;--ln:#cfd4dc;--bl:#2f6fe4;--bk:#0b0b0b;--lab:#e9ecf1;--inp:#fff;--ok:#12805c;--warn:#b86e00;--bad:#c62828;--sh:0 1px 3px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0f12;--card:#171a1f;--tx:#eceff3;--mut:#9aa1ab;--ln:#2f353d;--bl:#5b93f0;--lab:#20252c;--inp:#101317;--ok:#3ec999;--warn:#f0a43a;--bad:#ff6b6b}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Thmanyah Serif Display","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--bl);text-decoration:none}
.hide{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:12px}
/* header */
.top{background:#030303;color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
.top img{height:38px;width:auto;border-radius:4px;display:block}
.top .nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.top .nav a{color:#cfd4dc;padding:6px 12px;border-radius:20px;white-space:nowrap;font-size:15px}
.top .nav a.on{background:var(--bl);color:#fff}
.top .me{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfd4dc}
.top .me b{color:#fff}
.top button{background:#23272e;color:#fff;border:0;border-radius:18px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
/* basic */
h1.pt{font-size:22px;margin:10px 0}
h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:12px 0;box-shadow:var(--sh)}
.card>h3{margin:0 0 10px;font-size:17px;color:var(--bl);border-bottom:2px solid var(--bl);padding-bottom:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--inp);color:var(--tx)}
input[type=checkbox]{width:auto;transform:scale(1.25);margin-inline-end:6px}
input:disabled,select:disabled,textarea:disabled{opacity:.65}
textarea{resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bl);outline-offset:0}
.btn{font:inherit;font-size:15px;background:var(--bl);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;margin:3px;white-space:nowrap}
.btn.sec{background:#586070}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.line{background:transparent;color:var(--bl);border:1px solid var(--bl)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.nt{font-size:13px;color:var(--mut)}
.warn{background:rgba(184,110,0,.12);border:1px solid var(--warn);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.err{color:var(--bad);font-weight:600}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--mut)}
.badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:20px;color:#fff;background:#586070;white-space:nowrap}
.b-draft{background:#6b7280}.b-pending_approval{background:#b86e00}.b-approved{background:#2f6fe4}.b-in_progress{background:#7c3aed}.b-delivered{background:#12805c}.b-cancelled{background:#c62828}.b-archived{background:#374151}
.vb{background:var(--lab);color:var(--tx)}
/* login */
.login{max-width:400px;margin:6vh auto;padding:0 14px}
.login .hero{background:#030303;border-radius:14px;padding:12px;text-align:center;color:#fff}
.login .hero img{width:230px;max-width:80%;height:auto}
.login .hero small{display:block;color:#5b93f0;letter-spacing:3px;font-weight:700;font-size:13px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;color:var(--tx);display:block}
.stat b{display:block;font-size:28px;line-height:1.2;color:var(--bl)}
.stat span{font-size:13px;color:var(--mut)}
/* list */
.rows a.r{display:grid;grid-template-columns:1.1fr 1.4fr 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;margin:6px 0;color:var(--tx)}
.rows a.r small{color:var(--mut);display:block;font-size:12px}
.rows a.r:hover{border-color:var(--bl)}
@media(max-width:640px){.rows a.r{grid-template-columns:1fr auto}}
/* tables */
.sc{overflow-x:auto}
table.t{border-collapse:collapse;width:100%}
table.t th{background:var(--bk);color:#fff;font-size:13px;padding:6px;font-weight:600;text-align:right}
table.t td{border:1px solid var(--ln);padding:4px 6px;font-size:14px;vertical-align:top}
/* stepper */
.stepper{position:sticky;top:50px;z-index:10;background:var(--bg);padding:6px 0}
.steps{display:flex;gap:4px;overflow-x:auto}
.steps button{flex:1;min-width:92px;font:inherit;font-size:12px;border:1px solid var(--ln);background:var(--card);color:var(--mut);border-radius:8px;padding:4px 6px;cursor:pointer}
.steps button.on{background:var(--bl);border-color:var(--bl);color:#fff}
.steps button.done{border-color:var(--ok);color:var(--ok)}
.prog{height:6px;background:var(--lab);border-radius:4px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--bl);transition:width .2s}
.savestate{font-size:12px;color:var(--mut)}
.savestate.bad{color:var(--bad)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:14px 0}
/* services */
.svc{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--card)}
.svc.on{border-color:var(--bl)}
.svc .hd{display:flex;align-items:center;gap:6px;font-weight:700}
.svc .hd input[type=text]{font-weight:700}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.fin>div{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--lab);border-radius:8px;padding:6px 10px}
.fin b{font-size:17px}.fin input,.fin select{width:120px;text-align:center}
.fin .big{background:var(--bl);color:#fff}
/* car */
svg.car{width:100%;max-width:440px;background:#fff;border:1px solid var(--ln);border-radius:10px;display:block;margin:auto;touch-action:manipulation}
svg.car.ed{cursor:crosshair}
svg.car .o{fill:none;stroke:#4a4f57;stroke-width:1.6}
svg.car .lb{font-size:12px;fill:#555;text-anchor:middle;font-weight:600}
svg.car .mk{font-size:11px;fill:#fff;font-weight:700;text-anchor:middle}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.kinds span{background:var(--lab);border-radius:20px;padding:3px 12px;cursor:pointer;font-size:14px}
.kinds span.on{outline:2px solid var(--bl)}
/* photos */
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.ph figure{margin:0;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--card);position:relative}
.ph img{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in}
.ph figcaption{font-size:12px;padding:2px 6px;color:var(--mut)}
.ph button{position:absolute;top:4px;left:4px;background:rgba(198,40,40,.92);color:#fff;border:0;border-radius:6px;font-size:12px;padding:1px 8px;cursor:pointer}
/* signature */
.sigbox{border:1px dashed var(--ln);border-radius:10px;padding:8px}
.sigbox canvas{width:100%;height:160px;background:#fff;border:1px solid var(--ln);border-radius:8px;touch-action:none;display:block}
.sigbox img.sg{max-width:100%;height:90px;background:#fff;border:1px solid var(--ln);border-radius:8px;display:block}
/* checks */
.chk li{list-style:none;margin:2px 0}.chk .y{color:var(--ok)}.chk .n{color:var(--bad)}.chk .w{color:var(--warn)}
/* modal & toasts */
.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.mod .box{background:var(--card);color:var(--tx);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.mod .box h3{margin:0 0 8px}
#toasts{position:fixed;bottom:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none}
.toast{background:#222;color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;max-width:90vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:96vw;max-height:92vh}
/* paper (document view + print) */
.paper{background:#fff;color:#111;border:1px solid var(--ln);border-radius:6px;padding:14px;font-size:13px;line-height:1.6;overflow-x:auto}
.paper *{color:inherit}
.paper .hdr{background:#030303;color:#fff;border-radius:8px;display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
.paper .hdr *{color:#fff}
.paper .hdr img{height:56px;width:auto}
.paper .hdr .sub{font-size:11px;color:#cfd4dc}
.paper .tag{display:inline-block;border:1px solid #888;border-radius:4px;padding:0 8px;font-size:12px;font-weight:700}
.paper h4{margin:12px 0 4px;font-size:14px;border-bottom:2px solid #2f6fe4;color:#2f6fe4;padding-bottom:2px}
.paper table{border-collapse:collapse;width:100%;margin:4px 0}
.paper th{background:#0b0b0b;color:#fff;font-size:12px;padding:3px 5px;text-align:right}
.paper td{border:1px solid #bbb;padding:3px 6px;vertical-align:top;font-size:12.5px}
.paper td.l{background:#e9ecf1;font-weight:700;width:22%}
.paper .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #bbb}
.paper .kv div{padding:3px 6px;border:1px solid #ddd;font-size:12.5px}
.paper .kv b{display:block;font-size:11px;color:#555}
.paper .wm{text-align:center;font-size:15px;font-weight:700;color:#b86e00;border:2px dashed #b86e00;padding:3px;margin:6px 0}
.paper .sigs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.paper .sigs>div{border:1px solid #bbb;border-radius:6px;padding:6px;min-height:90px}
.paper .sigs img{height:60px;max-width:100%}
.paper .phg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.paper .phg figure{margin:0;border:1px solid #bbb;break-inside:avoid}
.paper .phg img{width:100%;height:120px;object-fit:cover;display:block}
.paper .phg figcaption{font-size:10.5px;padding:1px 4px}
.paper .tot td{font-weight:700}
.paper ol{margin:0;padding-inline-start:20px}
.paper ol li{margin-bottom:3px}
.paper .small{font-size:11px;color:#555}
.paper svg.car{max-width:300px}
.mono{font-family:ui-monospace,Menlo,monospace;direction:ltr;unicode-bidi:plaintext;word-break:break-all;font-size:10.5px}
#print-root{display:none}
@media print{
  @page{size:A4;margin:11mm}
  body{background:#fff!important;color:#000}
  #app,#toasts,#modal,.lightbox{display:none!important}
  #print-root{display:block}
  #print-root .paper{border:0;padding:0;overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper h4,.paper table,.paper .sigs{break-inside:avoid}
}

/* ========== الاتصال والجلسة ========== */
let sb=null;
const S={user:null,profile:null};
const isMgr=()=>S.profile&&S.profile.role!=='employee';
const isOwner=()=>S.profile&&S.profile.role==='owner';
const canApprove=()=>S.profile&&(S.profile.role==='owner'||S.profile.can_approve);
let idleT=null;
function resetIdle(){clearTimeout(idleT);if(S.user)idleT=setTimeout(()=>logout('انتهت الجلسة بسبب عدم النشاط'),IDLE_MIN*60000)}
['click','keydown','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

function fatal(msg){$('#app').innerHTML=`<div class="login"><div class="card err" style="text-align:center">${esc(msg)}</div></div>`}

async function boot(){
  if(!window.supabase){fatal('تعذر تحميل مكتبة الاتصال. تأكد من الإنترنت ثم أعد فتح الصفحة.');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{
    if(ev==='PASSWORD_RECOVERY')setTimeout(showNewPassword,0);
    else if(ev==='SIGNED_OUT'&&S.user)setTimeout(()=>{S.user=null;S.profile=null;renderLogin()},0);
  });
  const r=await sb.auth.getSession();
  const s=r&&r.data&&r.data.session;
  if(s)await afterAuth(s.user);else renderLogin();
}

async function afterAuth(user,quiet){
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error||!p||!p.active){await sb.auth.signOut();renderLogin(error?errMsg(error):'هذا الحساب غير مفعّل. تواصل مع المالك.');return false}
  S.user=user;S.profile=p;resetIdle();renderShell();
  if(!location.hash||location.hash==='#'||/access_token|type=recovery/.test(location.hash))location.hash='#/';
  route();return true
}

async function logout(msg){

function renderShell(){

function setNav(k){$$('.top .nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===k))}
function parseHash(){const h=(location.hash||'#/').slice(1);const [p,q]=h.split('?');const params=Object.fromEntries(new URLSearchParams(q||''));return {seg:p.split('/').filter(Boolean),params}}

let routing=Promise.resolve();
function route(){routing=routing.then(doRoute).catch(e=>{console.error(e)})}
window.addEventListener('hashchange',()=>{if(S.user)route()});
async function doRoute(){
  if(!S.user)return;
  if(C&&C.dirty){try{await saveNow()}catch(e){}}
  C=null;
  const {seg,params}=parseHash();const main=$('#main');if(!main)return;main.onclick=main.oninput=main.onchange=null;
  const a=seg[0]||'';
  try{
    if(a==='')await pageDash(main);
    else if(a==='contracts')await pageList(main,params);
    else if(a==='c')await pageContract(main,seg[1]);
    else if(a==='users')await pageUsers(main);
    else if(a==='audit')await pageAudit(main,params);
    else if(a==='settings')await pageSettings(main);
    else main.innerHTML='<div class="card">الصفحة غير موجودة. <a href="#/">الرئيسية</a></div>';
  }catch(e){main.innerHTML=`<div class="card err">${esc(errMsg(e))}</div>`}
  window.scrollTo(0,0);
}

let LS={q:'',status:'',from:'',to:'',by:'',old:false};
async function pageList(main,params){
  setNav('contracts');document.title='العقود — Best Protection';
  if(params.status!==undefined){LS={q:'',status:params.status||'',from:'',to:'',by:'',old:false}}
  let people=[];if(isMgr()){const pr=await sb.from('profiles').select('id,full_name,email').order('created_at');people=pr.data||[]}
  main.innerHTML=`<div class="row-between"><h1 class="pt">العقود</h1><a class="btn" href="#/c/new">＋ عقد جديد</a></div>
  <div class="card"><div class="g"><div><label>بحث (اسم العميل / الجوال / اللوحة / رقم العقد)</label><input id="fq" value="${esc(LS.q)}" placeholder="اكتب للبحث"></div>
  <div><label>الحالة</label><select id="fs"><option value="">الكل</option>${Object.keys(STATUS).map(k=>`<option value="${k}" ${LS.status===k?'selected':''}>${STATUS[k]}</option>`).join('')}</select></div>
  <div><label>من تاريخ</label><input type="date" id="ff" value="${esc(LS.from)}"></div><div><label>إلى تاريخ</label><input type="date" id="ft" value="${esc(LS.to)}"></div>
  ${isMgr()?`<div><label>الموظف</label><select id="fb"><option value="">الكل</option>${people.map(p=>`<option value="${esc(p.id)}" ${LS.by===p.id?'selected':''}>${esc(p.full_name||p.email)}</option>`).join('')}</select></div>`:''}
  <div style="align-self:end"><label><input type="checkbox" id="fo" ${LS.old?'checked':''}> إظهار النسخ القديمة</label></div></div></div>
  <div id="lres"></div>`;
  let page=0,tm=null;
  const load=async(more)=>{
    LS.q=$('#fq').value.trim();LS.status=$('#fs').value;LS.from=$('#ff').value;LS.to=$('#ft').value;LS.by=isMgr()?$('#fb').value:'';LS.old=$('#fo').checked;
    if(!more)page=0;const PS=30;
    let q=sb.from('contracts').select('id,contract_no,status,version,is_current,customer_name,customer_phone,plate_no,created_at,created_by',{count:'exact'}).order('created_at',{ascending:false}).range(page*PS,page*PS+PS-1);
    if(LS.status)q=q.eq('status',LS.status);
    if(!LS.old)q=q.eq('is_current',true);
    if(LS.by)q=q.eq('created_by',LS.by);
    if(LS.from)q=q.gte('created_at',LS.from+'T00:00:00+03:00');
    if(LS.to)q=q.lte('created_at',LS.to+'T23:59:59.999+03:00');
    if(LS.q){const a=LS.q.replace(/[%,()*\\"]/g,' ').trim(),d=digits(a);
      if(a)q=q.or([`customer_name.ilike.*${a}*`,`customer_phone.ilike.*${d}*`,`plate_no.ilike.*${a}*`,`plate_no.ilike.*${d}*`,`contract_no.ilike.*${a}*`].join(','))}
    const {data,error,count}=await q;const box=$('#lres');if(!box)return;
    if(error){box.innerHTML=`<div class="card err">${esc(errMsg(error))}</div>`;return}
    const html=(data||[]).map(r=>`<a class="r" href="#/c/${esc(r.id)}"><div><b>${esc(r.contract_no)}</b><small>${dt(r.created_at,true)}</small></div><div>${esc(r.customer_name||'— بدون اسم —')}<small>${esc(r.customer_phone||'')}</small></div><div>${esc(r.plate_no||'')}</div><div>${badge(r.status)} ${r.version>1?`<span class="badge vb">نسخة ${r.version}</span>`:''}${r.is_current?'':' <span class="badge vb">قديمة</span>'}</div></a>`).join('');
    if(more){box.querySelector('.rows').insertAdjacentHTML('beforeend',html)}
    else box.innerHTML=`<div class="nt">النتائج: ${count??(data||[]).length}</div><div class="rows">${html||'<div class="card muted">لا توجد نتائج.</div>'}</div><div id="mm"></div>`;
    const shown=(page+1)*PS;$('#mm').innerHTML=(count!=null&&shown<count)?'<button class="btn line" id="more">عرض المزيد</button>':'';
    if($('#more'))$('#more').onclick=()=>{page++;load(true)};
  };
  ['fs','ff','ft','fb','fo'].forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>load()});
  $('#fq').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>load(),350)};
  await load();
}

let saveTimer=null;
const bkKey=()=>'bp2bk_'+C.row.id;
function setSaveState(s,m){const e=$('#ss');if(!e)return;e.className='savestate'+(s==='error'||s==='conflict'?' bad':'');e.textContent={unsaved:'● تعديلات غير محفوظة…',saving:'جارٍ الحفظ…',saved:'✓ تم الحفظ',error:'تعذر الحفظ: '+(m||''),conflict:'تعارض: عُدّل العقد من جهاز آخر'}[s]||''}
function touch(){if(!C)return;C.dirty=true;C.ver++;setSaveState('unsaved');
  try{localStorage.setItem(bkKey(),JSON.stringify({t:Date.now(),data:C.o.data,delivery:C.o.delivery,u:C.row.updated_at}))}catch(e){}
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveNow().catch(()=>{})},1200)}
async function saveNow(){
  const c=C;if(!c||!c.dirty)return;if(c.saving){c.again=true;return}
  const st=c.row.status;let patch;
  if(st==='draft'&&editableData()){const d=c.o.data;patch={data:d,customer_name:(d.customer.name||'').trim(),customer_phone:digits(d.customer.phone||'').trim(),plate_no:digits(d.vehicle.plate||'').trim()}}
  else if(st==='in_progress'&&editableDelivery()){patch={delivery:c.o.delivery}}
  else{c.dirty=false;return}
  const v=c.ver;c.saving=true;setSaveState('saving');
  try{
    let r=await sb.from('contracts').update(patch).eq('id',c.row.id).eq('updated_at',c.row.updated_at).select('updated_at');
    if(r.error)throw r.error;
    if(!r.data||!r.data.length){
      const cur=await sb.from('contracts').select('updated_at').eq('id',c.row.id).maybeSingle();
      if(cur.data&&cur.data.updated_at!==c.row.updated_at){c.conflictTo=cur.data.updated_at;throw new Error('CONFLICT')}
      r=await sb.from('contracts').update(patch).eq('id',c.row.id).select('updated_at');
      if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('row-level security')}
    c.row.updated_at=r.data[0].updated_at;
    if(c.ver===v){c.dirty=false;try{localStorage.removeItem('bp2bk_'+c.row.id)}catch(e){}}
    if(C===c)setSaveState('saved')
  }catch(e){
    if(String(e.message)==='CONFLICT'){setSaveState('conflict');if(C===c)conflictBox();throw e}
    setSaveState('error',errMsg(e));throw e
  }finally{c.saving=false;if(c.again||(c.dirty&&c.ver!==v)){c.again=false;if(C===c){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveNow().catch(()=>{})},800)}}}
}

function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    cv.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('تعذر معالجة الصورة'))},'image/jpeg',.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('ملف غير مدعوم'))};img.src=url})}

  let dr=false,last=null;cv._d=false;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}dr=true;last=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(last[0]+.01,last[1]);ctx.stroke();cv._d=true};
  cv.onpointermove=e=>{if(!dr)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};

/* ========== صفحة العقد ========== */
async function pageContract(main,id){
  setNav('contracts');
  if(id==='new'){loading(main,'جارٍ إنشاء العقد…');await createContract();return}
  loading(main);await loadContract(id);
  document.title=C.row.contract_no+' — Best Protection';
  if(!viewed.has(id)){viewed.add(id);sb.rpc('log_event',{p_action:'view_contract',p_details:{no:C.row.contract_no}}).then(()=>{},()=>{})}
  // استعادة نسخة محلية غير محفوظة
  try{const bk=JSON.parse(localStorage.getItem(bkKey())||'null');
    if((editableData()||editableDelivery())&&bk&&bk.t>Date.parse(C.row.updated_at)&&JSON.stringify(editableData()?bk.data:bk.delivery)!==JSON.stringify(editableData()?C.o.data:C.o.delivery)){
      if(await confirmBox('تعديلات غير محفوظة','وُجدت تعديلات على هذا الجهاز لم تُحفظ في النظام. هل تريد استعادتها؟','استعادة')){
        if(editableData())C.o.data=ensureData(bk.data);else C.o.delivery=bk.delivery;touch()}
      else localStorage.removeItem(bkKey())}}catch(e){}
  renderContract(main);
  main.onclick=onClick;main.oninput=onField;main.onchange=onChange;
}
function renderContract(main){
  main=main||$('#main');DIS=editableData()?'':'disabled';
  const r=C.row;
  let h=head();
  if(editableData()){h+=stepper()+`<div id="stepbody">${stepBody()}</div>${footNav()}`}
  else{
    if(editableDelivery())h+=deliveryCard();
    h+=versionsCard();
    h+=`<div class="card"><h3>نص العقد</h3><div class="paper">${docHTML('shop',{noDelivery:editableDelivery()})}</div></div>`;
  }
  main.innerHTML=h;
  initPads(main);if(editableData())setSaveState('saved');
}
function head(){
  const r=C.row,d=C.o.data;
  return `<div class="row-between"><a href="#/contracts">← كل العقود</a><span>${badge(r.status)} ${r.version>1?`<span class="badge vb">نسخة ${r.version}</span>`:''}${r.is_current?'':' <span class="badge vb">نسخة قديمة</span>'}</span></div>
  <h1 class="pt">${esc(r.contract_no)} <small class="muted" style="font-size:14px">${esc(d.customer.name||'')} ${esc(d.vehicle.plate||'')}</small></h1>
  ${r.status==='cancelled'?`<div class="warn">العقد ملغي. السبب: ${esc(r.cancel_reason||'')}</div>`:''}
  <div class="card" style="padding:6px 10px">${actions()}</div>`}
function actions(){
  const r=C.row,b=(a,t,c)=>`<button class="btn ${c||''}" data-act="${a}">${t}</button>`,out=[];
  const act=canActOn();
  if(r.status==='draft'&&act){out.push(b('cancel','إلغاء العقد','bad'))}
  if(r.status==='pending_approval'){if(canApprove())out.push(b('approve','✔ اعتماد العقد','ok'));if(act)out.push(b('toDraft','إرجاع للتعديل','sec'));if(act)out.push(b('cancel','إلغاء','bad'))}
  if(r.status==='approved'){if(act)out.push(b('start','بدء التنفيذ','ok'));if(canApprove()&&act)out.push(b('cancel','إلغاء','bad'))}
  if(r.status==='in_progress'){if(canApprove()&&act)out.push(b('cancel','إلغاء','bad'))}
  if(r.status==='delivered'&&isMgr())out.push(b('archive','أرشفة','sec'));
  const child=C.versions.find(v=>v.parent_contract_id===r.id&&['draft','pending_approval'].includes(v.status));
  if(['approved','in_progress','delivered'].includes(r.status)&&r.is_current&&act&&!child)out.push(b('newver','＋ نسخة جديدة / ملحق تعديل','line'));
  if(child)out.push(`<a class="btn line" href="#/c/${esc(child.id)}">فتح النسخة الجديدة (${STATUS[child.status]})</a>`);
  out.push(b('pdfShop','PDF — نسخة المحل','sec'),b('pdfCust','PDF — نسخة العميل','sec'));
  if(isOwner())out.push(`<a class="btn line" href="#/audit?rec=${esc(r.id)}">سجل هذا العقد</a>`);
  if(isOwner()&&!r.approved_at&&['draft','cancelled'].includes(r.status)&&!C.versions.some(v=>v.parent_contract_id===r.id))out.push(b('delcontract','حذف العقد نهائياً','bad'));
  return out.join('')}
function footNav(){const last=C.step===STEPS.length-1,act=canActOn();
  return `<div class="foot"><div><button class="btn sec" data-act="prev" ${C.step?'':'disabled'}>← السابق</button></div><div>${last?`<button class="btn ok" data-act="submit">إرسال للاعتماد</button>`:`<button class="btn" data-act="next">التالي →</button>`}</div></div>`}

/* ========== الأحداث ========== */
function onField(e){
  const t=e.target,p=t.dataset&&t.dataset.p;if(!p||!C)return;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.dg){const nv=digits(v);if(nv!==v){t.value=nv;v=nv}}
  if(t.type==='checkbox'&&e.type==='input')return;
  setPath(C.o,p,v);
  const m=p.match(/^data\.services\.(\d+)\.(sel|price)$/);
  if(m){const s=C.o.data.services[+m[1]];
    if(m[2]==='price'&&nm(v)>0&&!s.sel){s.sel=true;const cb=$(`[data-p="data.services.${m[1]}.sel"]`);if(cb)cb.checked=true}
    const card=$('#svc'+m[1]);if(card)card.classList.toggle('on',!!s.sel)}
  if(/^data\.(services|fin)\./.test(p))updateTotals();
  touch()}
function onChange(e){
  const t=e.target;
  if(t.dataset&&t.dataset.up){const f=[...t.files];t.value='';if(f.length)uploadPhotos(f,t.dataset.up);return}
  if(t.type==='checkbox'||t.tagName==='SELECT')onField(e)}
async function onClick(e){
  if(!C)return;
  const z=e.target.closest('[data-zoom]');if(z){const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML=`<img src="${esc(z.dataset.zoom)}" alt="">`;lb.onclick=()=>lb.remove();document.body.append(lb);return}
  const st=e.target.closest('[data-step]');if(st){await goStep(+st.dataset.step);return}
  const kd=e.target.closest('[data-kind]');if(kd){curKind=kd.dataset.kind;$$('#kinds span').forEach(x=>x.classList.toggle('on',x.dataset.kind===curKind));return}
  const svg=e.target.closest('#carsvg');
  if(svg&&editableData()){
    const mi=e.target.closest('[data-mi]');
    if(mi)C.o.data.marks.splice(+mi.dataset.mi,1);
    else{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());C.o.data.marks.push({x:Math.round(q.x),y:Math.round(q.y),k:curKind})}
    $('#carwrap').innerHTML=carSVG(C.o.data.marks,true);$('#mlist').innerHTML=marksList();touch();return}
  const bt=e.target.closest('[data-act]');if(!bt)return;
  const a=bt.dataset.act,fn=ACT_FN[a];if(fn){bt.disabled=true;try{await fn(bt)}catch(x){if(!/CONFLICT/.test(String(x&&x.message)))toast(errMsg(x),'bad')}finally{bt.disabled=false}}}
async function goStep(n){
  if(n<0||n>=STEPS.length||n===C.step)return;
  try{if(C.dirty)await saveNow()}catch(e){}
  C.step=n;$('#stepbody').innerHTML=stepBody();initPads($('#stepbody'));
  $$('.steps button').forEach((b,i)=>b.className=i===n?'on':i<n?'done':'');$('.prog i').style.width=Math.round((n+1)/STEPS.length*100)+'%';
  const f=$('.foot');if(f)f.outerHTML=footNav();setSaveState(C.dirty?'unsaved':'saved');window.scrollTo(0,0)}
async function reload(){const id=C.row.id;await loadContract(id);renderContract()}
async function setStatus(to,extra){
  if(C.dirty)await saveNow();
  const {data,error}=await sb.from('contracts').update(Object.assign({status:to},extra||{})).eq('id',C.row.id).select('id,status');
  if(error)throw error;if(!data||!data.length)throw new Error('row-level security');
  await reload();window.scrollTo(0,0)}

const ACT_FN={
  prev:()=>goStep(C.step-1),next:()=>goStep(C.step+1),
  addsvc:()=>{const d=SERVICES.find(s=>s.custom);C.o.data.services.push(newService(d));touch();$('#stepbody').innerHTML=stepBody()},
  delsvc:async b=>{const i=+b.dataset.i;if(!await confirmBox('حذف الخدمة','هل تريد حذف هذه الخدمة الإضافية؟','حذف','bad'))return;C.o.data.services.splice(i,1);touch();$('#stepbody').innerHTML=stepBody()},
  delphoto:async b=>{if(!await confirmBox('حذف الصورة','سيتم حذف الصورة من العقد (يُسجَّل ذلك في سجل العمليات).','حذف','bad'))return;
    const {data,error}=await sb.from('contract_photos').delete().eq('id',b.dataset.id).select('id');if(error)throw error;if(!data||!data.length)throw new Error('row-level security');await reloadAttachments()},
  savesig:b=>saveSig(b.dataset.k),
  clrsig:b=>{const k=b.dataset.k,cv=$(`canvas[data-pad="${k}"]`);if(cv){cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv._d=false}},
  delsig:async b=>{if(!await confirmBox('حذف التوقيع','سيُحذف التوقيع ويمكنك إعادة التوقيع.','حذف','bad'))return;
    const s=sigOf(b.dataset.k);const {data,error}=await sb.from('contract_signatures').delete().eq('id',s.id).select('id');if(error)throw error;if(!data||!data.length)throw new Error('row-level security');await reloadAttachments()},
  submit:async()=>{
    if(C.dirty)await saveNow();const bad=checks().filter(c=>c.hard&&!c.ok);
    if(bad.length){toast('أكمل أولاً: '+bad.map(c=>c.t).join('، '),'bad');return}
    if(!await confirmBox('إرسال للاعتماد','بعد الإرسال يُقفل العقد للتعديل حتى يُعتمد أو يُرجع للتعديل. هل تريد المتابعة؟','إرسال'))return;
    await setStatus('pending_approval');toast('أُرسل العقد للاعتماد','ok')},
  toDraft:async()=>{if(!await confirmBox('إرجاع للتعديل','سيعود العقد مسودة لتعديله.','إرجاع'))return;await setStatus('draft')},
  approve:async()=>{if(!await confirmBox('اعتماد العقد','بعد الاعتماد يُقفل العقد ولا يمكن تعديله بصمت، وأي تغيير لاحق يتم بنسخة جديدة مع سجل تغييرات. هل تريد الاعتماد؟','اعتماد','ok'))return;await setStatus('approved');toast('تم اعتماد العقد','ok')},
  start:async()=>{if(!await confirmBox('بدء التنفيذ','سيُسجَّل بدء تنفيذ الخدمات، وتُفتح بيانات التسليم وصور ما بعد.','ابدأ'))return;await setStatus('in_progress')},
  cancel:async()=>{const why=await promptBox('إلغاء العقد','سبب الإلغاء (مطلوب)','إلغاء العقد',true);if(!why)return;await setStatus('cancelled',{cancel_reason:why});toast('أُلغي العقد','ok')},
  archive:async()=>{if(!await confirmBox('أرشفة العقد','سيُنقل العقد للأرشيف (ما زال قابلاً للبحث).','أرشفة'))return;await setStatus('archived')},
  deliver:async()=>{
    if(C.dirty)await saveNow();const dl=C.o.delivery;
    const miss=[];if(!dl.date)miss.push('تاريخ التسليم');if(!sigOf('delivery_customer'))miss.push('توقيع العميل على الاستلام');if(!sigOf('delivery_staff'))miss.push('توقيع الموظف');
    if(miss.length){toast('أكمل أولاً: '+miss.join('، '),'bad');return}
    const warn=C.photos.some(p=>p.phase==='after')?'':'<br><b>تنبيه:</b> لا توجد صور ما بعد التنفيذ.';
    if(!await confirmBox('تأكيد التسليم النهائي','بعد التأكيد تُقفل بيانات التسليم.'+warn,'تأكيد التسليم','ok'))return;await setStatus('delivered');toast('تم التسليم','ok')},
  newver:async()=>{
    const why=await promptBox('نسخة جديدة / ملحق تعديل','سبب التعديل (مطلوب). تبقى النسخة الحالية محفوظة كما هي، وتُنشأ نسخة جديدة كمسودة تحتاج توقيعاً واعتماداً.','إنشاء النسخة',true);if(!why)return;
    const nd=clone(C.o.data);nd.version_note=why;nd.shop=await shopSnap();
    const {data,error}=await sb.from('contracts').insert({parent_contract_id:C.row.id,customer_name:C.row.customer_name,customer_phone:C.row.customer_phone,plate_no:C.row.plate_no,data:nd,created_by:S.user.id}).select('id').single();
    if(error)throw error;location.hash='#/c/'+data.id},
  refterms:async()=>{if(!await confirmBox('تحديث الشروط','ستُستبدل شروط هذا العقد بالقالب الحالي المعتمد من المالك.','تحديث'))return;
    SHOP=null;C.o.data.terms=await termsTemplate();touch();$('#stepbody').innerHTML=stepBody();initPads($('#stepbody'));toast('تم تحديث الشروط','ok')},
  delcontract:async()=>{
    if(!isOwner())return;
    const why=await promptBox('حذف العقد نهائياً','سبب الحذف (مطلوب). سيُحذف العقد وتواقيعه وصوره ولا يمكن استرجاعه، ويُحفظ في سجل العمليات نسخة من بياناته.','متابعة',true);if(!why)return;
    if(!await confirmBox('تأكيد الحذف النهائي','هل أنت متأكد من حذف <b>'+esc(C.row.contract_no)+'</b> نهائياً؟','نعم، احذف','bad'))return;
    const paths=C.photos.map(p=>p.storage_path),id=C.row.id;
    const {error}=await sb.rpc('delete_contract',{p_id:id,p_reason:why});if(error)throw error;
    C.dirty=false;try{localStorage.removeItem(bkKey())}catch(e){}
    if(paths.length){const rm=await sb.storage.from('contract-files').remove(paths);if(rm.error)toast('حُذف العقد، لكن تعذر حذف بعض ملفات الصور','bad')}
    toast('تم حذف العقد','ok');location.hash='#/contracts'},
  pdfShop:()=>printDoc('shop'),pdfCust:()=>printDoc('customer')
};

/* ========== التسليم والنسخ ========== */
function deliveryCard(){
  DIS=editableDelivery()?'':'disabled';const dl=C.o.delivery;
  const f=(l,k,o={})=>`<div><label>${l}</label><input data-p="delivery.${k}" value="${esc(dl[k]||'')}" ${o.type?`type="${o.type}"`:''} ${DIS}></div>`;
  return `<div class="card"><div class="row-between"><h3 style="margin:0">التسليم النهائي</h3><span class="savestate" id="ss"></span></div>
  <div class="g" style="margin-top:8px">${f('تاريخ التسليم','date',{type:'date'})}${f('وقت التسليم','time',{type:'time'})}
  <div><label>حالة السيارة عند التسليم</label><select data-p="delivery.state" ${DIS}><option value=""></option>${['مطابقة للاتفاق','بها ملاحظات'].map(o=>`<option ${dl.state===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <label style="margin-top:8px">الخدمات التي تم تنفيذها</label><textarea rows="2" data-p="delivery.done" ${DIS}>${esc(dl.done||'')}</textarea>
  <label style="margin-top:8px">الملاحظات النهائية</label><textarea rows="2" data-p="delivery.notes" ${DIS}>${esc(dl.notes||'')}</textarea>
  <label style="margin-top:8px">ملاحظة الدفع عند التسليم (اختياري)</label><input data-p="delivery.pay_note" value="${esc(dl.pay_note||'')}" ${DIS}>
  <p style="margin-top:10px">أقرّ أنا العميل باستلام مركبتي بعد فحصها، وأن الخدمات المذكورة نُفّذت كما هو مبيّن في العقد، باستثناء ما دوّنته من ملاحظات.</p>
  <h4 style="margin:10px 0 4px">صور ما بعد التنفيذ</h4>${photosPanel('after',editableDelivery())}
  <div class="g2" style="margin-top:10px">${sigPanel('delivery_customer',editableDelivery(),C.o.data.customer.name)}${sigPanel('delivery_staff',editableDelivery(),S.profile.full_name||'')}</div>
  <div style="margin-top:10px"><button class="btn ok" data-act="deliver">تأكيد التسليم النهائي</button></div></div>`}
function versionsCard(){
  if(C.versions.length<2&&!C.parent)return '';
  const rows=C.versions.map(v=>`<tr><td>${v.id===C.row.id?'<b>':''}نسخة ${v.version}${v.id===C.row.id?' (الحالية في العرض)</b>':''}</td><td>${esc(v.contract_no)}</td><td>${badge(v.status)}${v.is_current?'':' <span class="badge vb">قديمة</span>'}</td><td>${dt(v.created_at,true)}</td><td>${v.id===C.row.id?'':`<a href="#/c/${esc(v.id)}">فتح</a>`}</td></tr>`).join('');
  return `<div class="card"><h3>إصدارات العقد</h3><div class="sc"><table class="t"><tr><th>الإصدار</th><th>الرقم</th><th>الحالة</th><th>التاريخ</th><th></th></tr>${rows}</table></div></div>`}

/* ========== مستند العقد (للعرض والطباعة) ========== */
function docHTML(mode,opt){
  opt=opt||{};const r=C.row,d=C.o.data,dl=C.o.delivery||{},shop=d.shop||{},T=totals(d),cust=mode==='customer';
  const blank='<span style="display:inline-block;min-width:90px;border-bottom:1px dotted #777">&nbsp;</span>';
  const v=x=>x?esc(x):blank;
  const kv=(l,x)=>`<div><b>${l}</b>${v(x)}</div>`;
  const final=['approved','in_progress','delivered','archived'].includes(r.status);
  const stLabel=r.status==='cancelled'?'عقد ملغي':final?'':'مسودة — غير معتمد بعد';
  let h=`<div class="hdr"><img src="${LOGO}" alt=""><div style="flex:1"><div style="font-size:17px;font-weight:700">${esc(shop.name_ar||'الحماية العالية لتلميع السيارات')}</div><div class="sub">${esc(shop.name_en||'Best Protection')}</div>
  <div class="sub">السجل التجاري: ${shop.cr?esc(shop.cr):'............'} · الرقم الضريبي: ${shop.vat?esc(shop.vat):'............'}</div><div class="sub">العنوان: ${shop.address?esc(shop.address):'............'} · التواصل: ${shop.phone?esc(shop.phone):'............'}${shop.email?' · '+esc(shop.email):''}</div></div>
  <div style="text-align:left"><span class="tag">${cust?'نسخة العميل':'نسخة المحل'}</span><div style="font-size:15px;font-weight:700">${esc(r.contract_no)}</div><div class="sub">النسخة ${r.version} · ${esc(STATUS[r.status])}</div><div class="sub">${dt(r.created_at)}</div></div></div>
  <div style="text-align:center;font-size:16px;font-weight:700;margin:8px 0">عقد استلام مركبة وتنفيذ خدمات العناية والحماية بالسيارات</div>${stLabel?`<div class="wm">${stLabel}</div>`:''}`;
  h+=`<h4>بيانات العميل</h4><div class="kv">${kv('اسم العميل',d.customer.name)}${kv('رقم الجوال',d.customer.phone)}${kv('الهوية / الإقامة',d.customer.id_no)}${kv('رقم الفاتورة',d.customer.invoice_no)}${kv('تاريخ الاستلام',d.customer.received_date)}${kv('التسليم المتوقع',d.customer.expected_date)}</div>
  <h4>بيانات المركبة</h4><div class="kv">${kv('نوع السيارة',d.vehicle.type)}${kv('الشركة',d.vehicle.make)}${kv('الموديل',d.vehicle.model)}${kv('سنة الصنع',d.vehicle.year)}${kv('اللون',d.vehicle.color)}${kv('رقم اللوحة',d.vehicle.plate)}${kv('رقم الهيكل',d.vehicle.vin)}${kv('العداد (كم)',d.vehicle.odometer)}${kv('الوقود',d.vehicle.fuel)}</div>`;
  h+=`<h4>فحص حالة السيارة عند الاستلام</h4><table><tr><th>البند</th><th style="width:90px">الحالة</th><th>التفاصيل</th></tr>${d.check.map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.s)}</td><td>${esc(c.t)}</td></tr>`).join('')}</table>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start">${carSVG(d.marks,false)}<div><b>العلامات على الرسم:</b><ol>${d.marks.map(m=>`<li>(${esc(m.k)}) ${esc(KINDS[m.k]||'')}</li>`).join('')||'<li style="list-style:none">لا توجد علامات</li>'}</ol></div></div>`;
  const sel=d.services.map((s,i)=>({s,i})).filter(x=>x.s.sel);
  h+=`<h4>الخدمات والأسعار</h4><table><tr><th>الخدمة</th><th>الوصف</th><th>الكمية</th><th>السعر</th><th>الخصم</th><th>الإجمالي</th></tr>${sel.map(({s,i})=>`<tr><td>${esc(s.name)}</td><td>${esc(s.desc)}</td><td>${esc(s.qty)}</td><td>${money(nm(s.price))}</td><td>${money(nm(s.discount))}</td><td>${money(T.lines[i])}</td></tr>`).join('')||'<tr><td colspan="6">—</td></tr>'}</table>
  <table style="width:55%;margin-inline-start:0"><tr><td class="l">إجمالي الخدمات</td><td>${money(T.g)}</td></tr><tr><td class="l">الخصم</td><td>${money(T.disc)}</td></tr><tr><td class="l">المبلغ قبل الضريبة</td><td>${money(T.net)}</td></tr><tr><td class="l">ضريبة القيمة المضافة 15%${d.fin.vat?'':' (غير مطبقة)'}</td><td>${money(T.vat)}</td></tr><tr class="tot"><td class="l">الإجمالي النهائي</td><td>${money(T.total)}</td></tr><tr><td class="l">العربون</td><td>${money(nm(d.fin.deposit))}</td></tr><tr><td class="l">المدفوع (شامل العربون)</td><td>${money(T.paid)}</td></tr><tr class="tot"><td class="l">المتبقي</td><td>${money(T.rem)}</td></tr><tr><td class="l">طريقة الدفع</td><td>${v(d.fin.method)}</td></tr></table>`;
  // تفاصيل الخدمات والضمان
  let det='';sel.forEach(({s})=>{const def=SERVICES.find(x=>x.k===s.k)||{f:[]};
    const rows=(def.f||[]).filter(f=>s.x[f[1]]).map(f=>`<tr><td class="l">${f[0]}</td><td>${esc(s.x[f[1]])}</td></tr>`).join('');
    let wr='';if(def.w){const w=s.w||{};const any=WFIELDS.some(f=>w[f[1]]);wr=any?WFIELDS.filter(f=>w[f[1]]).map(f=>`<tr><td class="l">${f[0]}</td><td>${esc(w[f[1]])}</td></tr>`).join(''):`<tr><td class="l">الضمان</td><td>لا يوجد ضمان مدوَّن لهذه الخدمة</td></tr>`}
    if(rows||wr)det+=`<b>${esc(s.name||'خدمة إضافية')}</b><table>${rows}${wr}</table>`});
  if(det)h+=`<h4>تفاصيل المواد والضمان</h4><div class="small">لا يوجد أي ضمان إلا ما دُوِّن في هذا القسم صراحةً، ويُميَّز بين ضمان المحل (على جودة التنفيذ) وضمان الشركة المصنعة (وفق شروطها الفعلية).</div>${det}`;
  // سجل التغييرات
  if(C.parent){const ch=diffLines(C.parent.data,d);h+=`<h4>ملحق تعديل — النسخة ${r.version} (تعديل على ${esc(C.parent.contract_no)} نسخة ${C.parent.version})</h4><div>سبب التعديل: <b>${esc(d.version_note||'—')}</b></div>${ch.length?`<table><tr><th>البند</th><th>قبل</th><th>بعد</th></tr>${ch.slice(0,60).map(x=>`<tr><td>${esc(x.k)}</td><td>${esc(x.a)}</td><td>${esc(x.b)}</td></tr>`).join('')}</table>`:'<div class="small">لا توجد فروق في البيانات عن النسخة السابقة.</div>'}`}
  h+=`<h4>الشروط والأحكام</h4><ol>${d.terms.map(t=>`<li><b>${esc(t.t)}:</b> ${termText(t.b,d.tp)}</li>`).join('')}</ol>`;
  const sg=k=>{const s=sigOf(k);return s?`<img src="${safeImg(s.image)}" alt=""><div class="small">${esc(s.signer_name)} — ${dt(s.signed_at,true)}</div>`:'<div class="small">— لم يُوقَّع —</div>'};
  h+=`<h4>التواقيع</h4><div class="sigs"><div><b>العميل</b>${sg('contract_customer')}</div><div><b>الموظف المسؤول — ${esc(shop.name_en||'Best Protection')}</b>${sg('contract_staff')}</div></div>`;
  // التسليم
  const hasDl=Object.values(dl).some(x=>x)||sigOf('delivery_customer');
  if(hasDl&&!opt.noDelivery){h+=`<h4>التسليم النهائي</h4><div class="kv">${kv('تاريخ التسليم',dl.date)}${kv('وقت التسليم',dl.time)}${kv('حالة السيارة',dl.state)}${kv('ملاحظة الدفع',dl.pay_note)}</div><table><tr><td class="l">الخدمات المنفذة</td><td>${esc(dl.done)}</td></tr><tr><td class="l">ملاحظات نهائية</td><td>${esc(dl.notes)}</td></tr></table>
    <div class="small">أقرّ أنا العميل باستلام مركبتي بعد فحصها، وأن الخدمات نُفّذت كما هو مبيّن، باستثناء ما دوّنته من ملاحظات.</div><div class="sigs"><div><b>العميل</b>${sg('delivery_customer')}</div><div><b>الموظف</b>${sg('delivery_staff')}</div></div>`}
  // الصور
  const ph=(phase)=>[...(phase==='before'?C.inh:[]),...C.photos.filter(p=>p.phase===phase)];
  [['before','صور الاستلام (قبل التنفيذ)'],['after','صور ما بعد التنفيذ']].forEach(([p,t])=>{const L=ph(p);if(L.length)h+=`<h4>${t}</h4><div class="phg">${L.map(x=>`<figure>${C.urls[x.storage_path]?`<img src="${esc(C.urls[x.storage_path])}" alt="">`:''}<figcaption>${esc(CAT[x.category]||'')}${x.inherited?' (من النسخة السابقة)':''}</figcaption></figure>`).join('')}</div>`});
  // معلومات الاعتماد
  if(final||r.approved_at){h+=`<h4>${cust?'بيانات الاعتماد':'بيانات الاعتماد والتدقيق'}</h4><div class="small">تاريخ الاعتماد: ${dt(r.approved_at,true)}${!cust?` · اعتمده: ${esc(C.names[r.approved_by]||'—')}`:''} · رمز التحقق: <span class="mono">${esc(cust?(r.approved_hash||'').slice(0,12):(r.approved_hash||''))}</span></div>`}
  if(!cust){h+=`<div class="small">أنشأه: ${esc(C.names[r.created_by]||'—')} · ${dt(r.created_at,true)} · آخر تعديل: ${dt(r.updated_at,true)}</div>${d.internal_notes?`<h4>ملاحظات داخلية</h4><div>${esc(d.internal_notes).replace(/\n/g,'<br>')}</div>`:''}
  <div class="small" style="margin-top:6px">ملاحظة: صياغة الشروط عامة ولم تُراجَع قانونياً، ويُنصح بمراجعتها من مستشار قانوني قبل الاعتماد التشغيلي.</div>`}
  return h}

async function printDoc(mode){
  if(C.dirty){try{await saveNow()}catch(e){}}
  await signUrls();
  const root=$('#print-root');root.innerHTML=`<div class="paper">${docHTML(mode)}</div>`;
  await Promise.all($$('img',root).map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));
  sb.rpc('log_event',{p_action:'export_pdf',p_details:{no:C.row.contract_no,mode}}).then(()=>{},()=>{});
  const old=document.title;document.title=`${C.row.contract_no}-${mode==='shop'?'نسخة-المحل':'نسخة-العميل'}`;
  window.onafterprint=()=>{root.innerHTML='';document.title=old;window.onafterprint=null};
  setTimeout(()=>window.print(),80)}

/* ========== تشغيل ========== */
document.addEventListener('DOMContentLoaded',boot);
</script></body></html>
